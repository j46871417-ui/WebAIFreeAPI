name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and architecture checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin-for-vscode/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install VS Code extension dependencies
        working-directory: plugin-for-vscode
        run: npm ci --ignore-scripts

      - name: Check CI invariants and duplicates
        run: npm run check:ci

      - name: Run tests
        run: npm test

      - name: Check VS Code extension build
        working-directory: plugin-for-vscode
        run: npm run build

      - name: Linux shell & python checks
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash -n linux/bin/ai-free
          bash -n linux/install.sh
          python3 -m py_compile linux/gui/ai_free_tray.py
          npm run build:linux
